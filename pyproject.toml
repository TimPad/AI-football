[project]
name = "aifootball"
version = "0.1.0"
description = "Аналитика футзальных матчей по видео со статичной камеры"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4",
    "trackers>=2.6",
    "supervision>=0.30",
    "polars>=1.40",
    "pyarrow>=20",
    "pyyaml>=6",
    "numpy>=2.0",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
vlm = ["httpx>=0.28,<1", "python-dotenv>=1,<2"]
dev = ["pytest>=8"]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3,<4",
    "argon2-cffi>=23",
    "python-multipart>=0.0.20",
    "pillow>=12,<13",
    "openpyxl>=3.1.5,<4",
    "httpx>=0.28,<1",
]
web-dev = ["httpx>=0.28,<1", "httpx2>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifootball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: прогон на настоящем видео с YOLO, минуты"]
addopts = "-m 'not slow'"
