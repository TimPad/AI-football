[project]
name = "aifootball"
version = "0.1.0"
description = "Аналитика футзальных матчей по видео со статичной камеры"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4",
    "trackers>=2.6",
    "supervision>=0.30",
    "polars>=1.40",
    "pyarrow>=20",
    "pyyaml>=6",
    "numpy>=2.0",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
vlm = ["httpx>=0.28,<1", "python-dotenv>=1,<2"]
dev = [
    "pytest>=8",
    "ruff>=0.17.5",
]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3,<4",
    "argon2-cffi>=23",
    "python-multipart>=0.0.20",
    "pillow>=12,<13",
    "openpyxl>=3.1.5,<4",
    "httpx>=0.28,<1",
    "cryptography>=46,<47",
]
web-dev = ["httpx>=0.28,<1", "httpx2>=2,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aifootball"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: прогон на настоящем видео с YOLO, минуты"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # длину строки держит форматтер; остаются только неразрывные строковые литералы
    # Долг на момент подключения линтера (14.11.2026), число — замечаний тогда.
    # Закрыли класс замечаний — уберите строку.
    "B905",  # 59: zip без strict; исправление меняет поведение
    "E731",  # 24: лямбда, присвоенная имени
    "B007",  # 15: неиспользуемая переменная цикла
    "B904",  # 12: raise без from внутри except
    "E741",  # 10: однобуквенные имена l/I/O
]

[tool.ruff.lint.flake8-bugbear]
# Зависимости и параметры FastAPI объявляются вызовом в значении по умолчанию.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File",
    "fastapi.Form", "fastapi.Body", "fastapi.Path", "fastapi.Cookie",
]

[tool.ruff.lint.per-file-ignores]
# Импорт моделей регистрирует таблицы в metadata.
"migrations/env.py" = ["F401"]
# Фикстура pytest приходит аргументом с тем же именем, что и её импорт (сам импорт помечен noqa: F401).
"tests/**" = ["F811"]
# Скрипты замеров настраивают окружение до импорта и строят замыкания в циклах.
"scripts/**" = ["E402", "B023"]
