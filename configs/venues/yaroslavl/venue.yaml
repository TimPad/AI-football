# Ярославль, YouTube n4WAFg0FfV4 — вторая тестовая запись: камера наблюдения 5 Мп
# (2592x1944, 14.9 fps) высоко в углу, всё поле в кадре, сильный широкий угол.
# Размер поля НЕ ИЗМЕРЕН: 40x20 — временное значение, пока нет гомографии.
# Контур поля и мяч от него не зависят; метры и скорости — зависят.
venue_id: yaroslavl
pitch:
  length_m: 40.0
  width_m: 20.0
processing:
  target_fps: 15      # исходник 14.9 fps — берём все кадры
  model: yolo11m.pt
  imgsz: 1280         # по эталону (200 кадров) 1920 и 2592 не лучше ни по мячу, ни по игрокам, а медленнее
  conf_person: 0.25
  conf_ball: 0.25     # для своей модели мяча: на эталоне 87% мячей найдено, 93% детекций верные
  # Мяч — дообученная модель (tools.ball_dataset), вырезками 1280 в полном разрешении по закрашенному
  # кадру; запас 80 px за контуром — ауты и игра у борта, а запасные мячи у скамейки (190–215 px) — нет.
  ball_model: ball_yaroslavl_v1/best.pt
  ball_tile: 1280
  ball_margin_px: 80
